<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AegisOne Extension Test Suite</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111726;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #64748b;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .test-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .test-info {
      display: flex;
      flex-direction: column;
    }
    .test-name {
      font-size: 13px;
      font-weight: 600;
    }
    .test-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .test-state {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .state-idle { color: var(--muted); }
    .state-running { color: var(--primary); }
    .state-passed { color: var(--success); }
    .state-failed { color: var(--danger); }

    .summary-stat {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .stat-val {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .console-log {
      background: #05070c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      font-family: monospace;
      font-size: 12px;
      height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🛡️ AegisOne Extension Test Suite</h1>
        <div style="font-size:12px; color:var(--muted); margin-top:4px;">In-Browser Integration and API Verifications</div>
      </div>
      <div id="envStatus" class="status-badge">Extension API Ready</div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-title">
          <span>Functional Integration Checklist</span>
          <button id="runBtn">Run All Tests</button>
        </div>
        <div class="test-list" id="testList">
          <!-- Dynamically populated -->
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom:30px;">
          <div class="card-title">Test Metrics</div>
          <div class="summary-stat">
            <div class="stat-box">
              <div class="stat-val" id="statPassed">0</div>
              <div class="stat-label">Passed</div>
            </div>
            <div class="stat-box">
              <div class="stat-val" id="statFailed">0</div>
              <div class="stat-label">Failed</div>
            </div>
          </div>
          <div class="stat-box" style="margin-bottom:15px;">
            <div class="stat-val" id="statLatency">0 ms</div>
            <div class="stat-label">Average L3 Scan Latency</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">System Console</div>
          <div class="console-log" id="consoleLog">Ready. Click 'Run All Tests' to begin...</div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="test_runner.js"></script>
</body>
</html>
