services:

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL — persistent database for the AegisOne backend
  # ──────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    platform: linux/amd64
    container_name: aegisone-db
    environment:
      POSTGRES_DB: aegisone
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aegisone_secret}
    volumes:
      - aegisone-pg-data:/var/lib/postgresql/data
    # Not published: only the backend and backup containers reach the database
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aegis -d aegisone" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # Backend API — FastAPI + AI Engine (Pre-built Docker Hub Image)
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    image: ahmedraza2006/aegisone-backend:${AEGIS_TAG:-latest}
    container_name: aegisone-backend
    command: [ "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    volumes:
      # Keeps the downloaded base-model files so restarts need no internet
      - aegisone-hf-cache:/root/.cache/huggingface
    environment:
      HF_HUB_ETAG_TIMEOUT: "5"
      AEGIS_PORT: "8000"
      AEGIS_WORKERS: "1"
      AEGIS_DATABASE_URL: "postgresql+asyncpg://aegis:${DB_PASSWORD:-aegisone_secret}@db:5432/aegisone"
      AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET:-change-me-in-production}
      AEGIS_DASHBOARD_URL: ${AEGIS_DASHBOARD_URL:-https://localhost}
      ORG_ID: ${ORG_ID:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      DEPLOYMENT_TOKEN: ${DEPLOYMENT_TOKEN:-}
      # License / org binding (see api/services/license.py): off | warn | strict
      AEGIS_LICENSE_ENFORCE: ${AEGIS_LICENSE_ENFORCE:-warn}
      AEGIS_REGISTRY_URL: ${AEGIS_REGISTRY_URL:-}
      AEGIS_REGISTRY_KEY: ${AEGIS_REGISTRY_KEY:-}
      # Vendor Model Hub the improved-weights submissions go to (optional)
      AEGIS_VENDOR_URL: ${AEGIS_VENDOR_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    # Published on loopback only; external traffic goes through the TLS proxy
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # Dashboard — Admin & Employee Portal (Pre-built Docker Hub Image)
  # ──────────────────────────────────────────────────────────────────────────
  dashboard:
    image: ahmedraza2006/aegisone-dashboard:${AEGIS_TAG:-latest}
    container_name: aegisone-dashboard
    expose:
      - "3000"
    environment:
      AEGIS_DASHBOARD_URL: "https://${SERVER_HOST:-localhost}"
    depends_on:
      - backend
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # TLS reverse proxy — HTTPS for the dashboard (:443) and API (:8443),
  # HTTP (:80) redirects to HTTPS. Certificates are issued/renewed automatically.
  # ──────────────────────────────────────────────────────────────────────────
  proxy:
    image: caddy:2
    container_name: aegisone-proxy
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      SERVER_HOST: ${SERVER_HOST:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard
      - backend
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # Database Backup — Automatic daily backups of PostgreSQL
  # ──────────────────────────────────────────────────────────────────────────
  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: aegisone-db-backup
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: aegisone
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aegisone_secret}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
    volumes:
      - ./aegisone-backups:/backups
    depends_on:
      - db

volumes:
  aegisone-hf-cache:
  aegisone-pg-data:
  caddy-data:
  caddy-config:
