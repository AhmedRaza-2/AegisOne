version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aegisone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegisone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegisone"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aegisone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # 3. Backend API (FastAPI - replaces Flask in our current stack)
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: aegisone-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aegis:password@postgres:5432/aegisone
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./api:/app/api
      - ./AIML:/app/AIML

  # 4. AI Inference Service (Optional isolation for heavy ML models)
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: aegisone-ai
    restart: unless-stopped
    environment:
      - MODEL_MODE=production
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - split-ai

  # 5. React Dashboard (Frontend)
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegisone-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
