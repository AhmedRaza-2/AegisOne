services:

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL — persistent database for the AegisOne backend
  # ──────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: aegisone-db
    environment:
      POSTGRES_DB: aegisone
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aegisone_secret}
    volumes:
      - aegisone-pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # expose so you can inspect with pgAdmin/psql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aegis -d aegisone" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # Backend API — FastAPI, connects to Postgres, loads AI models
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aegisone-backend
    command: [ "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    environment:
      AEGIS_PORT: "8000"
      AEGIS_WORKERS: "1"
      # PostgreSQL connection — backend auto-detects postgresql:// and enables connection pool
      AEGIS_DATABASE_URL: "postgresql+asyncpg://aegis:${DB_PASSWORD:-aegisone_secret}@db:5432/aegisone"
      AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET:-change-me-in-production}
      # Dashboard URL injected into welcome emails — set this to your server's IP/domain
      AEGIS_DASHBOARD_URL: ${AEGIS_DASHBOARD_URL:-http://localhost:3002}
      ORG_ID: ${ORG_ID:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      DEPLOYMENT_TOKEN: ${DEPLOYMENT_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      # Ollama Cloud API key — if set, Tier 2 XAI uses Ollama Cloud instead of local Ollama
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # wait for Postgres to be ready before starting
    restart: unless-stopped



  # ──────────────────────────────────────────────────────────────────────────
  # Dashboard — Next.js admin & employee portal
  # ──────────────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./frontend/dashboard
    container_name: aegisone-dashboard
    ports:
      - "3002:3000"
    environment:
      # NEXT_PUBLIC_API_BASE is read by src/lib/api.ts — set SERVER_HOST to your server IP
      NEXT_PUBLIC_API_BASE: "http://${SERVER_HOST:-localhost}:8000"
      NEXT_PUBLIC_API_BASE_URL: "http://${SERVER_HOST:-localhost}:8000"
      # Dashboard URL (used in welcome emails)
      AEGIS_DASHBOARD_URL: "http://${SERVER_HOST:-localhost}:3002"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  aegisone-pg-data: # PostgreSQL data — persists across restarts
