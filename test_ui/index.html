<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisOne - Live API Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --safe: #10b981;
            --medium: #f59e0b;
            --high: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.1), transparent 25%);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            flex-wrap: wrap;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 30px;
            flex: 1;
            min-width: 400px;
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        textarea,
        input[type="file"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.2s;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--surface-border);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        /* Output specific styles */
        .output-panel {
            display: flex;
            flex-direction: column;
        }

        .loader {
            display: none;
            border: 4px solid var(--surface-border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .result-card {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 auto 20px;
            border: 8px solid;
            background: rgba(0, 0, 0, 0.2);
        }

        .verdict-label {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .json-viewer {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Status Colors */
        .status-safe {
            border-color: var(--safe);
            color: var(--safe);
        }

        .status-low {
            border-color: #eab308;
            color: #eab308;
        }

        .status-medium {
            border-color: var(--medium);
            color: var(--medium);
        }

        .status-high {
            border-color: var(--high);
            color: var(--high);
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>AegisOne API Tester</h1>
        <p>Real-time threat analysis powered by DistilBERT & EfficientNet</p>
    </div>

    <div class="container">
        <!-- INPUT PANEL -->
        <div class="panel">
            <h2>🎯 Submit Content</h2>

            <div class="form-group">
                <label>Text or URL Analysis</label>
                <textarea id="textInput"
                    placeholder="Paste a URL, email body, or any suspicious text here..."></textarea>
            </div>
            <button onclick="scanText()">Scan Text / URL</button>

            <div class="divider">OR</div>

            <div class="form-group">
                <label>Image OCR or Document Scan</label>
                <input type="file" id="fileInput" accept="image/*,.pdf,.docx,.zip">
            </div>
            <button onclick="scanFile()">Scan File</button>
        </div>

        <!-- OUTPUT PANEL -->
        <div class="panel output-panel">
            <h2>⚡ Analysis Results</h2>

            <div class="loader" id="loader"></div>

            <div class="result-card" id="resultCard">
                <div class="score-circle" id="riskScore">0</div>
                <div class="verdict-label" id="verdictLabel">Awaiting Input...</div>

                <label>Raw API JSON Response</label>
                <div class="json-viewer">
                    <pre id="jsonOutput">Submit content to see the unified API response here.</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:9000';

        function resetUI() {
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
        }

        function renderResult(data) {
            document.getElementById('loader').style.display = 'none';

            const scoreEl = document.getElementById('riskScore');
            const verdictEl = document.getElementById('verdictLabel');
            const jsonEl = document.getElementById('jsonOutput');

            // Set Score (0-100 percentage)
            const score = data.overall_risk_score || 0;
            scoreEl.innerText = score + '%';

            // Remove old classes
            scoreEl.classList.remove('status-safe', 'status-low', 'status-medium', 'status-high');
            verdictEl.classList.remove('status-safe', 'status-low', 'status-medium', 'status-high');

            // Apply new colors based on verdict
            if (data.verdict === 'SAFE') {
                scoreEl.classList.add('status-safe');
                verdictEl.classList.add('status-safe');
            } else if (data.verdict === 'LOW_RISK') {
                scoreEl.classList.add('status-low');
                verdictEl.classList.add('status-low');
            } else if (data.verdict === 'MEDIUM_RISK') {
                scoreEl.classList.add('status-medium');
                verdictEl.classList.add('status-medium');
            } else {
                scoreEl.classList.add('status-high');
                verdictEl.classList.add('status-high');
            }

            verdictEl.innerText = data.verdict_label || 'Unknown';

            // Format JSON nicely
            jsonEl.innerText = JSON.stringify(data, null, 2);

            document.getElementById('resultCard').style.display = 'block';
        }

        function handleError(err) {
            document.getElementById('loader').style.display = 'none';
            alert("Error connecting to API. Is the FastAPI server running on port 9000?");
            console.error(err);
        }

        async function scanText() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) return alert("Please enter some text or a URL.");

            resetUI();

            // Auto route logic for the frontend just to pick the right endpoint
            // (The backend content_router handles the heavy lifting, but we call the specific endpoints)
            const isUrl = text.startsWith('http') && !text.includes(' ');
            const endpoint = isUrl ? '/scan/url' : '/scan/text';
            const payload = isUrl ? { url: text } : { text: text };

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                renderResult(data);
            } catch (err) {
                handleError(err);
            }
        }

        async function scanFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return alert("Please select a file.");

            const file = fileInput.files[0];
            resetUI();

            const formData = new FormData();
            formData.append('file', file);

            // Determine endpoint based on type
            const isImage = file.type.startsWith('image/');
            const endpoint = isImage ? '/scan/image' : '/scan/document';

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                renderResult(data);
            } catch (err) {
                handleError(err);
            }
        }

        // Show empty state initially
        document.getElementById('resultCard').style.display = 'block';
    </script>

</body>

</html>
