name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [dashboard, landing]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit --incremental false
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    runs-on: ubuntu-latest
    # Informational for now: some tests need the model weights (shipped in the Docker image, not in git) and a database.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # model weights are stored with Git LFS (see .gitattributes)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU PyTorch, then the rest
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest api/tests -q
